<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>Painel ZenPad - Porto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      padding: 15px;
      user-select: none;
      overflow: hidden;
    }
    
    .controls {
      position: absolute;
      top: 10px;
      left: 15px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      background: #1c1c1e;
      color: #8e8e93;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }
    .btn:active {
      background: #2c2c2e;
      color: #ffffff;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      gap: 15px;
      width: 100%;
      height: 100%;
      padding-top: 32px;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    .clock-container {
      text-align: center;
      padding-top: 10px;
    }
    .time {
      font-size: 5.2rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
    }
    .date {
      font-size: 1.2rem;
      color: #8e8e93;
      text-transform: capitalize;
      margin-top: 8px;
    }

    .right-column {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    .card {
      background: #1c1c1e;
      padding: 16px;
      border-radius: 16px;
      width: 100%;
    }

    .card-stcp {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 0.85rem;
      color: #8e8e93;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .weather-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .weather-temp {
      font-size: 1.8rem;
      font-weight: 300;
    }
    .weather-desc {
      color: #aeaeb2;
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .bus-stop-section {
      margin-bottom: 15px;
    }
    .bus-stop-header {
      color: #0a84ff;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 6px;
      border-bottom: 1px solid #2c2c2e;
      padding-bottom: 4px;
    }
    .bus-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2c2c2e1a;
    }
    .bus-row:last-child {
      border-bottom: none;
    }
    .bus-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bus-line-badge {
      background: #0a84ff;
      color: #ffffff;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 45px;
      text-align: center;
    }
    .bus-dest {
      color: #ffffff;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .bus-time-text {
      color: #30d158;
      font-weight: bold;
      font-size: 1.05rem;
    }
    .status-text {
      color: #636366;
      font-size: 0.88rem;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <!-- Controlo Superior -->
  <div class="controls">
    <button class="btn" onclick="toggleFullscreen()">🖥️ Ecrã Inteiro</button>
    <button class="btn" onclick="updateAllData()">🔄 Atualizar</button>
  </div>

  <!-- Contentor Principal -->
  <div class="main-container">
    
    <!-- Coluna Esquerda: Relógio + Clima -->
    <div class="left-column">
      <div class="clock-container">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">A carregar data...</div>
      </div>

      <div class="card">
        <div class="card-title">Clima (Porto)</div>
        <div id="weather-today">
          <div class="weather-temp" id="today-temp">Hoje: --°C</div>
          <div class="weather-desc" id="today-desc">A carregar...</div>
        </div>
        <div id="weather-tomorrow" style="margin-top: 10px; border-top: 1px solid #2c2c2e; padding-top: 8px;">
          <div class="weather-temp" id="tomorrow-temp" style="font-size: 1.35rem;">Amanhã: --°C</div>
          <div class="weather-desc" id="tomorrow-desc">A carregar...</div>
        </div>
      </div>
    </div>

    <!-- Coluna Direita: Autocarros Directos da Travel Porto -->
    <div class="right-column">
      <div class="card card-stcp">
        <div class="card-title">
          <span>STCP - Fluvial</span>
          <span id="last-sync" style="font-size: 0.7rem; font-weight: normal; color: #636366;">--:--</span>
        </div>
        
        <!-- Paragem FLUN2 -->
        <div class="bus-stop-section">
          <div class="bus-stop-header">Paragem FLUN2</div>
          <div id="stop-flun2-list">
            <div class="status-text">A consultar horários...</div>
          </div>
        </div>

        <!-- Paragem FLU1 -->
        <div class="bus-stop-section" style="margin-top: 10px;">
          <div class="bus-stop-header">Paragem FLU1</div>
          <div id="stop-flu1-list">
            <div class="status-text">A consultar horários...</div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Ecrã Inteiro
    function toggleFullscreen() {
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    // Relógio
    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      document.getElementById('time').innerHTML = hours + ':' + minutes;
      
      var options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').innerHTML = now.toLocaleDateString('pt-PT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Meteorologia (Open-Meteo)
    function getWeatherDescription(code) {
      var codes = {
        0: "Céu Limpo", 1: "Principalmente Limpo", 2: "Parcialmente Nublado", 3: "Nublado",
        45: "Nevoeiro", 48: "Nevoeiro com Geada", 51: "Chuvisco Leve", 53: "Chuvisco Moderado",
        55: "Chuvisco Intenso", 61: "Chuva Fraca", 63: "Chuva Moderada", 65: "Chuva Forte",
        80: "Aguaceiros Fracos", 81: "Aguaceiros Moderados", 82: "Aguaceiros Fortes", 95: "Trovoada"
      };
      return codes[code] || "Variável";
    }

    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast?latitude=41.1579&longitude=-8.6291&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe%2FLisbon";
      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var currentTemp = Math.round(data.current_weather.temperature);
          var todayMax = Math.round(data.daily.temperature_2m_max[0]);
          var todayMin = Math.round(data.daily.temperature_2m_min[0]);
          var todayCode = data.current_weather.weathercode;

          document.getElementById('today-temp').innerHTML = "Hoje: " + currentTemp + "°C";
          document.getElementById('today-desc').innerHTML = getWeatherDescription(todayCode) + " (" + todayMin + "° / " + todayMax + "°)";

          var tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
          var tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
          var tomorrowCode = data.daily.weathercode[1];

          document.getElementById('tomorrow-temp').innerHTML = "Amanhã: " + tomorrowMin + "° / " + tomorrowMax + "°C";
          document.getElementById('tomorrow-desc').innerHTML = getWeatherDescription(tomorrowCode);
        })
        .catch(function() {
          document.getElementById('today-desc').innerHTML = "Erro ao carregar clima";
        });
    }

    // Consulta Direta ao site Travel Porto sem intermediários
    function fetchBusStopData(stopCode, elementId) {
      var targetUrl = 'https://www.travel-porto.pt/stop/' + stopCode;
      
      fetch(targetUrl)
        .then(function(response) {
          if (!response.ok) throw new Error("Erro na rede");
          return response.text();
        })
        .then(function(htmlText) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(htmlText, 'text/html');
          var container = document.getElementById(elementId);
          
          var arrivals = [];

          // Extrai linhas e tempos de chegada da tabela do travel-porto.pt
          var trs = doc.querySelectorAll('tr');
          trs.forEach(function(tr) {
            var tds = tr.querySelectorAll('td');
            if (tds.length >= 2) {
              var line = tds[0].textContent.trim();
              var dest = tds.length >= 3 ? tds[1].textContent.trim() : '';
              var time = tds[tds.length - 1].textContent.trim();

              if (line && time && (/\d/.test(line) || /min|passar|hora/i.test(time))) {
                arrivals.push({ line: line, destination: dest, time: time });
              }
            }
          });

          // Caso o HTML use elementos alternativos de lista
          if (arrivals.length === 0) {
            var matches = [...htmlText.matchAll(/([0-9]{1,3}[A-Z]?)\s*[-|]\s*([^-\n<]+?)\s*[-|]\s*([0-9]+\s*min|a passar|à hora|[0-9]{2}:[0-9]{2})/gi)];
            matches.forEach(function(m) {
              arrivals.push({ line: m[1].trim(), destination: m[2].trim(), time: m[3].trim() });
            });
          }

          if (arrivals.length > 0) {
            var renderHtml = '';
            var limit = Math.min(arrivals.length, 2); // Mostra os 2 próximos autocarros

            for (var i = 0; i < limit; i++) {
              var item = arrivals[i];
              renderHtml += '<div class="bus-row">' +
                              '<div class="bus-info">' +
                                '<span class="bus-line-badge">' + item.line + '</span>' +
                                '<span class="bus-dest">' + item.destination + '</span>' +
                              '</div>' +
                              '<span class="bus-time-text">' + item.time + '</span>' +
                            '</div>';
            }
            container.innerHTML = renderHtml;
          } else {
            container.innerHTML = '<div class="status-text">Sem autocarros previstos em breve</div>';
          }
        })
        .catch(function(err) {
          document.getElementById(elementId).innerHTML = '<div class="status-text">A consultar horários...</div>';
        });
    }

    function updateAllBuses() {
      fetchBusStopData('FLUN2', 'stop-flun2-list');
      fetchBusStopData('FLU1', 'stop-flu1-list');

      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      document.getElementById('last-sync').innerText = 'Sinc. ' + hours + ':' + minutes;
    }

    function updateAllData() {
      fetchWeather();
      updateAllBuses();
    }

    // Execução Inicial
    updateAllData();

    // Intervalos de Atualização
    setInterval(updateAllBuses, 30 * 1000); // Autocarros atualizados a cada 30 segundos
    setInterval(fetchWeather, 30 * 60 * 1000); // Tempo atualizado a cada 30 minutos
  </script>
</body>
</html>
