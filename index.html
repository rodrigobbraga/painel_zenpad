<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Painel ZenPad - Porto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      user-select: none;
      overflow: hidden;
      position: relative;
    }
    
    /* Controlo Superior */
    .controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #1c1c1e;
      color: #8e8e93;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      background: #2c2c2e;
      color: #ffffff;
    }

    /* Relógio */
    .clock-container {
      text-align: center;
      margin-top: 25px;
    }
    .time {
      font-size: 5.5rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
    }
    .date {
      font-size: 1.3rem;
      color: #8e8e93;
      text-transform: capitalize;
      margin-top: 8px;
    }

    /* Grelha Lado a Lado */
    .grid {
      display: -webkit-flex;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 15px;
      width: 100%;
      margin-bottom: 10px;
    }
    .card {
      background: #1c1c1e;
      padding: 18px;
      border-radius: 16px;
      flex: 1;
      -webkit-flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 0.9rem;
      color: #8e8e93;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    /* Clima */
    .weather-temp {
      font-size: 1.8rem;
      font-weight: 300;
    }
    .weather-desc {
      color: #aeaeb2;
      font-size: 0.9rem;
      margin-top: 2px;
    }

    /* Autocarros */
    .bus-stop-title {
      color: #0a84ff;
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      margin-bottom: 2px;
    }
    .bus-line {
      font-weight: bold;
      color: #ffffff;
    }
    .bus-time {
      color: #30d158;
      font-weight: bold;
    }
    .loading-text {
      color: #636366;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Botões de Controlo -->
  <div class="controls">
    <button class="btn" onclick="toggleFullscreen()">🖥️ Ecrã Inteiro</button>
    <button class="btn" onclick="window.location.reload()">🔄 Atualizar</button>
  </div>

  <!-- Relógio e Data -->
  <div class="clock-container">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">A carregar data...</div>
  </div>

  <!-- Clima e Autocarros Lado a Lado -->
  <div class="grid">
    <!-- Bloco do Clima -->
    <div class="card">
      <div class="card-title">Clima (Porto)</div>
      <div id="weather-today">
        <div class="weather-temp" id="today-temp">Hoje: --°C</div>
        <div class="weather-desc" id="today-desc">A carregar...</div>
      </div>
      <div id="weather-tomorrow" style="margin-top: 10px; border-top: 1px solid #2c2c2e; padding-top: 8px;">
        <div class="weather-temp" id="tomorrow-temp" style="font-size: 1.35rem;">Amanhã: --°C</div>
        <div class="weather-desc" id="tomorrow-desc">A carregar...</div>
      </div>
    </div>

    <!-- Bloco da STCP -->
    <div class="card">
      <div class="card-title">STCP - Fluvial</div>
      
      <div class="bus-stop-title">FLUN2</div>
      <div id="bus-flun2">
        <div class="loading-text">A consultar...</div>
      </div>

      <div class="bus-stop-title" style="margin-top: 8px;">FLU1</div>
      <div id="bus-flu1">
        <div class="loading-text">A consultar...</div>
      </div>
    </div>
  </div>

  <script>
    // Ecrã Inteiro
    function toggleFullscreen() {
      var elem = document.documentElement;
      if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.requestFullscreen) {
        elem.requestFullscreen();
      }
    }

    // Relógio
    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      document.getElementById('time').innerHTML = hours + ':' + minutes;
      
      var options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').innerHTML = now.toLocaleDateString('pt-PT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Dicionário de Tempo
    function getWeatherDescription(code) {
      var codes = {
        0: "Céu Limpo", 1: "Principalmente Limpo", 2: "Parcialmente Nublado", 3: "Nublado",
        45: "Nevoeiro", 48: "Nevoeiro com Geada", 51: "Chuvisco Leve", 53: "Chuvisco Moderado",
        55: "Chuvisco Intenso", 61: "Chuva Fraca", 63: "Chuva Moderada", 65: "Chuva Forte",
        80: "Aguaceiros Fracos", 81: "Aguaceiros Moderados", 82: "Aguaceiros Fortes", 95: "Trovoada"
      };
      return codes[code] || "Variável";
    }

    // Clima via HTTPS / XHR
    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast?latitude=41.1579&longitude=-8.6291&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe%2FLisbon";
      var xhr = new XMLHttpRequest();
      
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);
            var currentTemp = Math.round(data.current_weather.temperature);
            var todayMax = Math.round(data.daily.temperature_2m_max[0]);
            var todayMin = Math.round(data.daily.temperature_2m_min[0]);
            var todayCode = data.current_weather.weathercode;

            document.getElementById('today-temp').innerHTML = "Hoje: " + currentTemp + "°C";
            document.getElementById('today-desc').innerHTML = getWeatherDescription(todayCode) + " (" + todayMin + "° / " + todayMax + "°)";

            var tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
            var tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
            var tomorrowCode = data.daily.weathercode[1];

            document.getElementById('tomorrow-temp').innerHTML = "Amanhã: " + tomorrowMin + "° / " + tomorrowMax + "°C";
            document.getElementById('tomorrow-desc').innerHTML = getWeatherDescription(tomorrowCode);
          } catch(e) {
            document.getElementById('today-desc').innerHTML = "Erro no clima";
          }
        }
      };
      xhr.send();
    }

    // Leitor do HTML do novo site da STCP
    function parseStcpHtml(htmlText) {
      var results = [];
      // Procura elementos com tempos e linhas na nova estrutura da STCP
      var matches = htmlText.match(/<tr[\s\S]*?<\/tr>/gi) || htmlText.match(/<li[\s\S]*?<\/li>/gi) || [];

      for (var i = 0; i < matches.length && i < 2; i++) {
        var row = matches[i];
        var lineMatch = row.match(/(\d{3}[A-Z]?|\b[1-9]\b)/i);
        var timeMatch = row.match(/(\d+\s*min|à hora|a passar)/i);

        if (lineMatch && timeMatch) {
          results.push({ line: lineMatch[1], time: timeMatch[1] });
        }
      }
      return results;
    }

    // Autocarros STCP com o novo link
    function fetchBusStops() {
      var stops = [
        { code: 'FLUN2', elementId: 'bus-flun2' },
        { code: 'FLU1', elementId: 'bus-flu1' }
      ];

      stops.forEach(function(stop) {
        var targetUrl = 'https://stcp.pt/pt/paragem?stop=' + stop.code;
        var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
        var xhr = new XMLHttpRequest();

        xhr.open("GET", proxyUrl, true);
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 400) {
            try {
              var response = JSON.parse(xhr.responseText);
              var buses = parseStcpHtml(response.contents || '');
              var container = document.getElementById(stop.elementId);

              if (buses.length > 0) {
                var html = '';
                for (var i = 0; i < buses.length; i++) {
                  html += '<div class="bus-item">' +
                            '<span class="bus-line">Linha ' + buses[i].line + '</span>' +
                            '<span class="bus-time">' + buses[i].time + '</span>' +
                          '</div>';
                }
                container.innerHTML = html;
              } else {
                container.innerHTML = '<div class="loading-text">Sem autocarros previstos</div>';
              }
            } catch(e) {
              document.getElementById(stop.elementId).innerHTML = '<div class="loading-text">Erro nos dados</div>';
            }
          }
        };
        xhr.onerror = function() {
          document.getElementById(stop.elementId).innerHTML = '<div class="loading-text">Indisponível</div>';
        };
        xhr.send();
      });
    }

    // Execução Inicial
    fetchWeather();
    fetchBusStops();

    // Timers
    setInterval(fetchWeather, 30 * 60 * 1000);
    setInterval(fetchBusStops, 40 * 1000);
  </script>
</body>
</html>
