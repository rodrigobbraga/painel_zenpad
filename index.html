<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Minimalista</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
    }
    
    /* Relógio */
    .clock-container { text-align: center; margin-top: 20px; }
    .time { font-size: 5.5rem; font-weight: 200; letter-spacing: -2px; }
    .date { font-size: 1.5rem; color: #8e8e93; text-transform: capitalize; margin-top: 5px; }

    /* Seção de Clima e Autocarros */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 16px; }
    .card-title { font-size: 1.1rem; color: #8e8e93; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

    /* Clima */
    .weather-temp { font-size: 2.5rem; font-weight: 300; }
    .weather-desc { color: #aeaeb2; font-size: 1rem; margin-top: 4px; }

    /* Autocarros */
    .bus-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.2rem; }
    .bus-line { font-weight: 600; color: #0a84ff; }
    .bus-time { color: #30d158; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Relógio Principal -->
  <div class="clock-container">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">A carregar data...</div>
  </div>

  <!-- Informação Secundária -->
  <div class="grid">
    <!-- Clima Hoje e Amanhã -->
    <div class="card">
      <div class="card-title">Clima</div>
      <div id="weather-today">
        <div class="weather-temp">Hoje: --°C</div>
        <div class="weather-desc">A carregar...</div>
      </div>
      <div id="weather-tomorrow" style="margin-top: 15px; border-top: 1px solid #2c2c2e; padding-top: 10px;">
        <div class="weather-temp" style="font-size: 1.8rem;">Amanhã: --°C</div>
        <div class="weather-desc">A carregar...</div>
      </div>
    </div>

    <!-- Paragens de Autocarro -->
    <div class="card">
      <div class="card-title">Próximos Autocarros</div>
      <div id="bus-arrivals">
        <div class="bus-item">
          <span><span class="bus-line">Paragem 1</span></span>
          <span class="bus-time">5 min</span>
        </div>
        <div class="bus-item">
          <span><span class="bus-line">Paragem 2</span></span>
          <span class="bus-time">12 min</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Relógio
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}`;
      
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-PT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Nota: Aqui podes integrar a tua chave da OpenWeatherMap e API de transportes locais
  </script>
</body>
</html>
