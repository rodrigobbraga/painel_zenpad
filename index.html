<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Configuração de Web App / Ecrã Inteiro -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>Painel ZenPad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px;
      user-select: none;
      overflow: hidden;
    }
    
    /* Relógio Principal */
    .clock-container {
      text-align: center;
      margin-top: 10px;
    }
    .time {
      font-size: 6rem;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
    }
    .date {
      font-size: 1.4rem;
      color: #8e8e93;
      text-transform: capitalize;
      margin-top: 8px;
    }

    /* Estrutura Lado a Lado (Flexbox compatível com Android antigo) */
    .grid {
      display: -webkit-flex;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 15px;
      width: 100%;
      margin-bottom: 10px;
    }
    .card {
      background: #1c1c1e;
      padding: 20px;
      border-radius: 16px;
      flex: 1;
      -webkit-flex: 1;
      min-width: 0; /* Previne transbordo de texto */
    }
    .card-title {
      font-size: 0.95rem;
      color: #8e8e93;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Clima */
    .weather-temp {
      font-size: 2rem;
      font-weight: 300;
    }
    .weather-desc {
      color: #aeaeb2;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Autocarros */
    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }
    .bus-item:last-child {
      margin-bottom: 0;
    }
    .bus-line {
      font-weight: 600;
      color: #0a84ff;
    }
    .bus-time {
      color: #30d158;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Relógio e Data -->
  <div class="clock-container">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">A carregar data...</div>
  </div>

  <!-- Clima e Autocarros (Lado a Lado) -->
  <div class="grid">
    <!-- Bloco do Clima -->
    <div class="card">
      <div class="card-title">Clima</div>
      <div id="weather-today">
        <div class="weather-temp">Hoje: --°C</div>
        <div class="weather-desc">A carregar...</div>
      </div>
      <div id="weather-tomorrow" style="margin-top: 12px; border-top: 1px solid #2c2c2e; padding-top: 8px;">
        <div class="weather-temp" style="font-size: 1.5rem;">Amanhã: --°C</div>
        <div class="weather-desc">A carregar...</div>
      </div>
    </div>

    <!-- Bloco dos Autocarros -->
    <div class="card">
      <div class="card-title">Próximos Autocarros</div>
      <div id="bus-arrivals">
        <div class="bus-item">
          <span><span class="bus-line">Paragem 1</span></span>
          <span class="bus-time">-- min</span>
        </div>
        <div class="bus-item">
          <span><span class="bus-line">Paragem 2</span></span>
          <span class="bus-time">-- min</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Atualizar Relógio e Data
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}`;
      
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-PT', options);
    }
    
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
