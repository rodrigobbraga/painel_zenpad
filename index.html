<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Configuração de Web App / Ecrã Inteiro -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>Painel ZenPad - Porto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      user-select: none;
      overflow: hidden;
    }
    
    /* Relógio Principal */
    .clock-container {
      text-align: center;
      margin-top: 5px;
    }
    .time {
      font-size: 5.8rem;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
    }
    .date {
      font-size: 1.3rem;
      color: #8e8e93;
      text-transform: capitalize;
      margin-top: 6px;
    }

    /* Estrutura Lado a Lado (Flexbox) */
    .grid {
      display: -webkit-flex;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 15px;
      width: 100%;
      margin-bottom: 5px;
    }
    .card {
      background: #1c1c1e;
      padding: 18px;
      border-radius: 16px;
      flex: 1;
      -webkit-flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 0.9rem;
      color: #8e8e93;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Clima */
    .weather-temp {
      font-size: 1.8rem;
      font-weight: 300;
    }
    .weather-desc {
      color: #aeaeb2;
      font-size: 0.88rem;
      margin-top: 2px;
      text-transform: capitalize;
    }

    /* Autocarros */
    .bus-stop-title {
      color: #0a84ff;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      margin-bottom: 3px;
    }
    .bus-line {
      font-weight: 600;
      color: #ffffff;
    }
    .bus-time {
      color: #30d158;
      font-weight: 500;
    }
    .loading-text {
      color: #636366;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Relógio e Data -->
  <div class="clock-container">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">A carregar data...</div>
  </div>

  <!-- Clima e Autocarros -->
  <div class="grid">
    <!-- Bloco do Clima (Porto) -->
    <div class="card">
      <div class="card-title">Clima (Porto)</div>
      <div id="weather-today">
        <div class="weather-temp" id="today-temp">Hoje: --°C</div>
        <div class="weather-desc" id="today-desc">A carregar...</div>
      </div>
      <div id="weather-tomorrow" style="margin-top: 10px; border-top: 1px solid #2c2c2e; padding-top: 6px;">
        <div class="weather-temp" id="tomorrow-temp" style="font-size: 1.35rem;">Amanhã: --°C</div>
        <div class="weather-desc" id="tomorrow-desc">A carregar...</div>
      </div>
    </div>

    <!-- Bloco dos Autocarros (STCP) -->
    <div class="card">
      <div class="card-title">STCP - Fluvial</div>
      
      <div class="bus-stop-title">Paragem FLUN2</div>
      <div id="bus-flun2">
        <div class="loading-text">A carregar...</div>
      </div>

      <div class="bus-stop-title" style="margin-top: 8px;">Paragem FLU1</div>
      <div id="bus-flu1">
        <div class="loading-text">A carregar...</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Relógio e Data
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}`;
      
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-PT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Dicionário de Códigos de Tempo
    function getWeatherDescription(code) {
      const codes = {
        0: "Céu Limpo", 1: "Principalmente Limpo", 2: "Parcialmente Nublado", 3: "Nublado",
        45: "Nevoeiro", 48: "Nevoeiro com Geada", 51: "Chuvisco Leve", 53: "Chuvisco Moderado",
        55: "Chuvisco Intenso", 61: "Chuva Fraca", 63: "Chuva Moderada", 65: "Chuva Forte",
        80: "Aguaceiros Fracos", 81: "Aguaceiros Moderados", 82: "Aguaceiros Fortes", 95: "Trovoada"
      };
      return codes[code] || "Variável";
    }

    // 2. Clima em Tempo Real (Porto)
    function fetchWeather() {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=41.1579&longitude=-8.6291&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe%2FLisbon";

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          const currentTemp = Math.round(data.current_weather.temperature);
          const todayMax = Math.round(data.daily.temperature_2m_max[0]);
          const todayMin = Math.round(data.daily.temperature_2m_min[0]);
          const todayCode = data.current_weather.weathercode;

          document.getElementById('today-temp').textContent = `Hoje: ${currentTemp}°C`;
          document.getElementById('today-desc').textContent = `${getWeatherDescription(todayCode)} (${todayMin}° / ${todayMax}°)`;

          const tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
          const tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
          const tomorrowCode = data.daily.weathercode[1];

          document.getElementById('tomorrow-temp').textContent = `Amanhã: ${tomorrowMin}° / ${tomorrowMax}°C`;
          document.getElementById('tomorrow-desc').textContent = getWeatherDescription(tomorrowCode);
        })
        .catch(function() {
          document.getElementById('today-desc').textContent = "Erro ao carregar clima";
        });
    }

    // 3. Processador de Autocarros STCP (Compatível com Android Antigo via Regex)
    function parseStcpHtml(htmlText) {
      var results = [];
      // Procura todas as linhas da tabela de autocarros
      var rowRegex = /<tr[^>]*class=["']linha-stcp["'][\s\S]*?<\/tr>/gi;
      var matches = htmlText.match(rowRegex) || [];

      for (var i = 0; i < matches.length && i < 2; i++) {
        var row = matches[i];
        
        // Extrai a linha e o tempo
        var lineMatch = row.match(/class=["']linha["'][^>]*>([\s\S]*?)<\/td>/i) || row.match(/<b>([\s\S]*?)<\/b>/i);
        var timeMatch = row.match(/class=["']tempo["'][^>]*>([\s\S]*?)<\/td>/i) || row.match(/(\d+\s*min|à hora|a passar)/i);

        if (lineMatch && timeMatch) {
          var line = lineMatch[1].replace(/<[^>]+>/g, '').trim();
          var time = timeMatch[1].replace(/<[^>]+>/g, '').trim();
          if (line && time) {
            results.push({ line: line, time: time });
          }
        }
      }
      return results;
    }

    function fetchBusStops() {
      var stops = [
        { code: 'FLUN2', elementId: 'bus-flun2' },
        { code: 'FLU1', elementId: 'bus-flu1' }
      ];

      stops.forEach(function(stop) {
        var targetUrl = 'https://www.stcp.pt/itinerarios/estacao.php?p=' + stop.code;
        // Usa o proxy corsproxy.io que é mais rápido e estável
        var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

        fetch(proxyUrl)
          .then(function(res) { return res.text(); })
          .then(function(htmlText) {
            var container = document.getElementById(stop.elementId);
            var buses = parseStcpHtml(htmlText);

            if (buses.length > 0) {
              var html = '';
              buses.forEach(function(b) {
                html += '<div class="bus-item">' +
                          '<span class="bus-line">' + b.line + '</span>' +
                          '<span class="bus-time">' + b.time + '</span>' +
                        '</div>';
              });
              container.innerHTML = html;
            } else {
              container.innerHTML = '<div class="loading-text">Sem autocarros previstos</div>';
            }
          })
          .catch(function() {
            // Se o primeiro proxy falhar, tenta o proxy alternativo
            var fallbackProxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
            fetch(fallbackProxy)
              .then(function(res) { return res.json(); })
              .then(function(data) {
                var container = document.getElementById(stop.elementId);
                var buses = parseStcpHtml(data.contents || '');
                if (buses.length > 0) {
                  var html = '';
                  buses.forEach(function(b) {
                    html += '<div class="bus-item">' +
                              '<span class="bus-line">' + b.line + '</span>' +
                              '<span class="bus-time">' + b.time + '</span>' +
                            '</div>';
                  });
                  container.innerHTML = html;
                } else {
                  container.innerHTML = '<div class="loading-text">Sem autocarros previstos</div>';
                }
              })
              .catch(function() {
                document.getElementById(stop.elementId).innerHTML = '<div class="loading-text">Indisponível de momento</div>';
              });
          });
      });
    }

    // Execução Inicial
    fetchWeather();
    fetchBusStops();

    // Atualização automática
    setInterval(fetchWeather, 30 * 60 * 1000); // Clima de 30 em 30 min
    setInterval(fetchBusStops, 30 * 1000);     // Autocarros de 30 em 30 seg
  </script>
</body>
</html>
