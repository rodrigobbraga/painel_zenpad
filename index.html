<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>Painel ZenPad - Porto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      height: 100vh;
      padding: 15px;
      user-select: none;
      overflow: hidden;
      position: relative;
    }
    
    /* Botões de Controlo Superior */
    .controls {
      position: absolute;
      top: 10px;
      left: 15px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      background: #1c1c1e;
      color: #8e8e93;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      background: #2c2c2e;
      color: #ffffff;
    }

    /* Contentor Principal de 2 Colunas */
    .main-container {
      display: -webkit-flex;
      display: flex;
      flex-direction: row;
      gap: 15px;
      width: 100%;
      height: 100%;
      padding-top: 32px;
    }

    /* Coluna Esquerda: Relógio + Clima */
    .left-column {
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      -webkit-flex: 1;
      min-width: 0;
      height: 100%;
    }

    .clock-container {
      text-align: center;
      padding-top: 10px;
    }
    .time {
      font-size: 5.2rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
    }
    .date {
      font-size: 1.2rem;
      color: #8e8e93;
      text-transform: capitalize;
      margin-top: 8px;
    }

    /* Coluna Direita: STCP */
    .right-column {
      flex: 1;
      -webkit-flex: 1;
      min-width: 0;
      height: 100%;
    }

    .card {
      background: #1c1c1e;
      padding: 16px;
      border-radius: 16px;
      width: 100%;
    }

    .card-stcp {
      height: 100%;
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 0.85rem;
      color: #8e8e93;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Clima */
    .weather-temp {
      font-size: 1.8rem;
      font-weight: 300;
    }
    .weather-desc {
      color: #aeaeb2;
      font-size: 0.88rem;
      margin-top: 2px;
    }

    /* Elementos de Autocarro Nativo */
    .bus-stop-section {
      margin-bottom: 15px;
    }
    .bus-stop-header {
      color: #0a84ff;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 6px;
      border-bottom: 1px solid #2c2c2e;
      padding-bottom: 4px;
    }
    .bus-row {
      display: -webkit-flex;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 1.1rem;
    }
    .bus-line-badge {
      background: #2c2c2e;
      color: #ffffff;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .bus-time-text {
      color: #30d158;
      font-weight: bold;
    }
    .status-text {
      color: #636366;
      font-size: 0.88rem;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <!-- Controlo Superior -->
  <div class="controls">
    <button class="btn" onclick="toggleFullscreen()">🖥️ Ecrã Inteiro</button>
    <button class="btn" onclick="window.location.reload()">🔄 Atualizar</button>
  </div>

  <!-- Contentor Principal -->
  <div class="main-container">
    
    <!-- Coluna Esquerda: Relógio + Clima -->
    <div class="left-column">
      <div class="clock-container">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">A carregar data...</div>
      </div>

      <div class="card">
        <div class="card-title">Clima (Porto)</div>
        <div id="weather-today">
          <div class="weather-temp" id="today-temp">Hoje: --°C</div>
          <div class="weather-desc" id="today-desc">A carregar...</div>
        </div>
        <div id="weather-tomorrow" style="margin-top: 10px; border-top: 1px solid #2c2c2e; padding-top: 8px;">
          <div class="weather-temp" id="tomorrow-temp" style="font-size: 1.35rem;">Amanhã: --°C</div>
          <div class="weather-desc" id="tomorrow-desc">A carregar...</div>
        </div>
      </div>
    </div>

    <!-- Coluna Direita: STCP Nativo (Sem Iframe) -->
    <div class="right-column">
      <div class="card card-stcp">
        <div class="card-title">STCP - Fluvial</div>
        
        <!-- Paragem FLUN2 -->
        <div class="bus-stop-section">
          <div class="bus-stop-header">Paragem FLUN2</div>
          <div id="stop-flun2-list">
            <div class="status-text">A consultar horários...</div>
          </div>
        </div>

        <!-- Paragem FLU1 -->
        <div class="bus-stop-section" style="margin-top: 10px;">
          <div class="bus-stop-header">Paragem FLU1</div>
          <div id="stop-flu1-list">
            <div class="status-text">A consultar horários...</div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Ecrã Inteiro
    function toggleFullscreen() {
      var elem = document.documentElement;
      if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.requestFullscreen) {
        elem.requestFullscreen();
      }
    }

    // Relógio
    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      document.getElementById('time').innerHTML = hours + ':' + minutes;
      
      var options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').innerHTML = now.toLocaleDateString('pt-PT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Weather
    function getWeatherDescription(code) {
      var codes = {
        0: "Céu Limpo", 1: "Principalmente Limpo", 2: "Parcialmente Nublado", 3: "Nublado",
        45: "Nevoeiro", 48: "Nevoeiro com Geada", 51: "Chuvisco Leve", 53: "Chuvisco Moderado",
        55: "Chuvisco Intenso", 61: "Chuva Fraca", 63: "Chuva Moderada", 65: "Chuva Forte",
        80: "Aguaceiros Fracos", 81: "Aguaceiros Moderados", 82: "Aguaceiros Fortes", 95: "Trovoada"
      };
      return codes[code] || "Variável";
    }

    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast?latitude=41.1579&longitude=-8.6291&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe%2FLisbon";
      var xhr = new XMLHttpRequest();
      
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);
            var currentTemp = Math.round(data.current_weather.temperature);
            var todayMax = Math.round(data.daily.temperature_2m_max[0]);
            var todayMin = Math.round(data.daily.temperature_2m_min[0]);
            var todayCode = data.current_weather.weathercode;

            document.getElementById('today-temp').innerHTML = "Hoje: " + currentTemp + "°C";
            document.getElementById('today-desc').innerHTML = getWeatherDescription(todayCode) + " (" + todayMin + "° / " + todayMax + "°)";

            var tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
            var tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
            var tomorrowCode = data.daily.weathercode[1];

            document.getElementById('tomorrow-temp').innerHTML = "Amanhã: " + tomorrowMin + "° / " + tomorrowMax + "°C";
            document.getElementById('tomorrow-desc').innerHTML = getWeatherDescription(tomorrowCode);
          } catch(e) {
            document.getElementById('today-desc').innerHTML = "Erro no clima";
          }
        }
      };
      xhr.send();
    }

    // Consulta de Autocarros STCP em JSON nativo
    function fetchBusStopData(stopCode, elementId) {
      // Endpoint de consulta direta de chegadas em tempo real
      var apiUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://stcp.pt/pt/paragem?stop=' + stopCode);
      var xhr = new XMLHttpRequest();

      xhr.open("GET", apiUrl, true);
      xhr.onload = function() {
        var container = document.getElementById(elementId);
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var response = JSON.parse(xhr.responseText);
            var htmlContent = response.contents || '';
            
            // Procura números de linhas e tempos no texto extraído
            var busMatches = htmlContent.match(/(\d{3}[A-Z]?)\s*-\s*([\d\w\s]+?)\s*-\s*(\d+\s*min|a passar|à hora)/gi);
            
            if (busMatches && busMatches.length > 0) {
              var renderHtml = '';
              var limit = Math.min(busMatches.length, 3); // Mostra até 3 autocarros por paragem
              
              for (var i = 0; i < limit; i++) {
                var parts = busMatches[i].split('-');
                var line = parts[0] ? parts[0].trim() : 'STCP';
                var time = parts[parts.length - 1] ? parts[parts.length - 1].trim() : '';

                renderHtml += '<div class="bus-row">' +
                                '<span class="bus-line-badge">Linha ' + line + '</span>' +
                                '<span class="bus-time-text">' + time + '</span>' +
                              '</div>';
              }
              container.innerHTML = renderHtml;
            } else {
              container.innerHTML = '<div class="status-text">Sem autocarros previstos nos próximos minutos</div>';
            }
          } catch(e) {
            container.innerHTML = '<div class="status-text">A atualizar horários...</div>';
          }
        } else {
          container.innerHTML = '<div class="status-text">Serviço indisponível</div>';
        }
      };
      xhr.onerror = function() {
        document.getElementById(elementId).innerHTML = '<div class="status-text">Sem ligação</div>';
      };
      xhr.send();
    }

    function updateAllBuses() {
      fetchBusStopData('FLUN2', 'stop-flun2-list');
      fetchBusStopData('FLU1', 'stop-flu1-list');
    }

    // Execução Inicial e Intervalos
    fetchWeather();
    updateAllBuses();

    setInterval(fetchWeather, 30 * 60 * 1000);
    setInterval(updateAllBuses, 35 * 1000); // Atualiza os autocarros a cada 35 segundos
  </script>
</body>
</html>
