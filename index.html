<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>Painel ZenPad - Porto</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      padding: 14px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    .header-bar {
      display: -webkit-flex;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 38px;
      margin-bottom: 12px;
    }

    .status-pill {
      font-size: 0.8rem;
      color: #8e8e93;
      background: #1c1c1e;
      padding: 5px 12px;
      border-radius: 12px;
      border: 1px solid #2c2c2e;
      letter-spacing: 0.3px;
    }

    .controls {
      display: -webkit-flex;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #1c1c1e;
      color: #0a84ff;
      border: 1px solid #2c2c2e;
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      background: #2c2c2e;
      color: #ffffff;
    }

    .main-container {
      display: -webkit-flex;
      display: flex;
      flex-direction: row;
      gap: 14px;
      height: calc(100vh - 64px);
      width: 100%;
    }

    /* Coluna Esquerda: Relógio + Clima */
    .left-column {
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      -webkit-flex: 1;
      min-width: 0;
      height: 100%;
    }

    .card {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 18px;
      padding: 18px;
      width: 100%;
    }

    .clock-card {
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 22px 12px;
      background: linear-gradient(180deg, #1c1c1e 0%, #121214 100%);
    }

    .time {
      font-size: 5.5rem;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: 1.2rem;
      color: #8e8e93;
      margin-top: 12px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .weather-card {
      flex: 1;
      -webkit-flex: 1;
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    .card-title {
      font-size: 0.75rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;
      display: -webkit-flex;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .weather-section {
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .weather-info {
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
    }

    .weather-label {
      font-size: 0.8rem;
      color: #0a84ff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .weather-temp {
      font-size: 1.9rem;
      font-weight: 300;
      line-height: 1.1;
      margin-top: 2px;
    }

    .weather-desc {
      color: #8e8e93;
      font-size: 0.85rem;
      margin-top: 3px;
    }

    .weather-icon {
      width: 46px;
      height: 46px;
    }

    .divider {
      height: 1px;
      background: #2c2c2e;
      margin: 8px 0;
    }

    /* Coluna Direita: Iframes do Travel Porto */
    .right-column {
      flex: 1.3;
      -webkit-flex: 1.3;
      min-width: 0;
      height: 100%;
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .iframe-container {
      flex: 1;
      -webkit-flex: 1;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 18px;
      padding: 12px;
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .iframe-header {
      font-size: 0.85rem;
      color: #ff9f0a;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: -webkit-flex;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .travel-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      background: #ffffff; /* Fundo branco para legibilidade das páginas web */
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="status-pill" id="last-update">Painel Ativo</div>
    <div class="controls">
      <button class="btn" onclick="toggleFullscreen()">🖥️ Ecrã Inteiro</button>
      <button class="btn" onclick="refreshPages()">🔄 Atualizar</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- Coluna Esquerda: Relógio + Clima -->
    <div class="left-column">
      
      <div class="card clock-card">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">A carregar data...</div>
      </div>

      <div class="card weather-card">
        <div class="card-title">
          <span>Clima (Porto)</span>
          <span style="font-size: 0.7rem; color: #30d158;">Open-Meteo</span>
        </div>

        <div class="weather-section">
          <div class="weather-info">
            <span class="weather-label">Hoje</span>
            <span class="weather-temp" id="today-temp">--°C</span>
            <span class="weather-desc" id="today-desc">A carregar...</span>
          </div>
          <div id="today-icon-container">
            <svg class="weather-icon" viewBox="0 0 24 24"><path fill="#ff9f0a" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3z"/></svg>
          </div>
        </div>

        <div class="divider"></div>

        <div class="weather-section">
          <div class="weather-info">
            <span class="weather-label" style="color: #8e8e93;">Amanhã</span>
            <span class="weather-temp" id="tomorrow-temp" style="font-size: 1.4rem;">--°C</span>
            <span class="weather-desc" id="tomorrow-desc">A carregar...</span>
          </div>
          <div id="tomorrow-icon-container">
            <svg class="weather-icon" viewBox="0 0 24 24"><path fill="#aeaeb2" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
          </div>
        </div>

      </div>
    </div>

    <!-- Coluna Direita: Iframes com as paragens FLUN2 e FLU1 -->
    <div class="right-column">
      
      <!-- Paragem FLUN2 -->
      <div class="iframe-container">
        <div class="iframe-header">
          <span>Paragem FLUN2 (Fluvial Norte)</span>
        </div>
        <iframe id="frame-flun2" class="travel-frame" src="https://www.travel-porto.pt/stop/FLUN2"></iframe>
      </div>

      <!-- Paragem FLU1 -->
      <div class="iframe-container">
        <div class="iframe-header">
          <span>Paragem FLU1 (Fluvial Sul)</span>
        </div>
        <iframe id="frame-flu1" class="travel-frame" src="https://www.travel-porto.pt/stop/FLU1"></iframe>
      </div>

    </div>

  </div>

  <script>
    function toggleFullscreen() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      var timeStr = hours + ':' + minutes;

      document.getElementById('time').innerHTML = timeStr;

      var options = { weekday: 'long', day: 'numeric', month: 'long' };
      var dateStr = now.toLocaleDateString('pt-PT', options);
      dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
      document.getElementById('date').innerHTML = dateStr;
    }

    setInterval(updateClock, 1000);
    updateClock();

    function getWeatherInfo(code) {
      var sunIcon = '<svg class="weather-icon" viewBox="0 0 24 24"><path fill="#ff9f0a" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-13c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1V3c0-.55.45-1 1-1zm0 18c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1v-2c0-.55.45-1 1-1z"/></svg>';
      var cloudIcon = '<svg class="weather-icon" viewBox="0 0 24 24"><path fill="#aeaeb2" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>';
      var rainIcon = '<svg class="weather-icon" viewBox="0 0 24 24"><path fill="#0a84ff" d="M12 2c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2s-2-.9-2-2V4c0-1.1.9-2 2-2zm-6 8c1.1 0 2 .9 2 2v6c0 1.1-.9 2-2 2s-2-.9-2-2v-6c0-1.1.9-2 2-2zm12 0c1.1 0 2 .9 2 2v6c0 1.1-.9 2-2 2s-2-.9-2-2v-6c0-1.1.9-2 2-2z"/></svg>';
      var stormIcon = '<svg class="weather-icon" viewBox="0 0 24 24"><path fill="#ffd60a" d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>';

      if (code === 0) return ["Céu Limpo", sunIcon];
      if (code === 1 || code === 2) return ["Parcialmente Nublado", cloudIcon];
      if (code === 3) return ["Nublado", cloudIcon];
      if (code >= 45 && code <= 48) return ["Nevoeiro", cloudIcon];
      if (code >= 51 && code <= 67) return ["Chuva / Chuvisco", rainIcon];
      if (code >= 80 && code <= 82) return ["Aguaceiros", rainIcon];
      if (code >= 95) return ["Trovoada", stormIcon];

      return ["Variável", cloudIcon];
    }

    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast?latitude=41.1579&longitude=-8.6291&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe%2FLisbon";
      
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);
            var currentTemp = Math.round(data.current_weather.temperature);
            var todayMax = Math.round(data.daily.temperature_2m_max[0]);
            var todayMin = Math.round(data.daily.temperature_2m_min[0]);
            var todayCode = data.current_weather.weathercode;
            var todayInfo = getWeatherInfo(todayCode);

            document.getElementById('today-temp').innerHTML = currentTemp + "°C";
            document.getElementById('today-desc').innerHTML = todayInfo[0] + " (" + todayMin + "° / " + todayMax + "°)";
            document.getElementById('today-icon-container').innerHTML = todayInfo[1];

            var tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
            var tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
            var tomorrowCode = data.daily.weathercode[1];
            var tomorrowInfo = getWeatherInfo(tomorrowCode);

            document.getElementById('tomorrow-temp').innerHTML = tomorrowMin + "° / " + tomorrowMax + "°C";
            document.getElementById('tomorrow-desc').innerHTML = tomorrowInfo[0];
            document.getElementById('tomorrow-icon-container').innerHTML = tomorrowInfo[1];
          } catch(e) {}
        }
      };
      xhr.send();
    }

    function refreshPages() {
      var now = new Date();
      var timeStr = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
      document.getElementById('last-update').innerHTML = 'Atualizado às ' + timeStr;

      fetchWeather();
      
      // Recarrega os iframes para forçar a busca de novos horários
      document.getElementById('frame-flun2').src = document.getElementById('frame-flun2').src;
      document.getElementById('frame-flu1').src = document.getElementById('frame-flu1').src;
    }

    refreshWeather();

    // Atualiza o clima e os iframes automaticamente a cada 2 minutos
    setInterval(refreshPages, 120000);
  </script>
</body>
</html>
